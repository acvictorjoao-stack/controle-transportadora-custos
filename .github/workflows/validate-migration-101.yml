            from pg_temp.ci_rel r
            join pg_constraint c
              on c.contype = 'f'
             and c.conrelid = ('public.' || r.child)::regclass
             and c.confrelid = ('public.' || r.parent)::regclass
            where cardinality(c.conkey) = 1;
            if v_bad is not null then raise exception 'FK simples filho -> pai remanescente: %', v_bad; end if;

            select string_agg(f, ', ') into v_bad
            from unnest(array[
              'sync_customer_contract_revenue', 'recalculate_maintenance_costs',
              'log_maintenance_parts_history', 'log_maintenance_services_history',
