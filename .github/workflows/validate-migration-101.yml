                             coalesce(pg_get_expr(d.adbin, d.adrelid), '-'))
            from pg_attribute a
            join rels on a.attrelid = rels.r
            left join pg_attrdef d on d.adrelid = a.attrelid and d.adnum = a.attnum
            where a.attnum > 0 and not a.attisdropped

            union all
            select concat_ws('|', 'con', c.conrelid::regclass::text, c.conname::text,
                             pg_get_constraintdef(c.oid), c.convalidated::text)
            from pg_constraint c
            join rels on c.conrelid = rels.r

            union all
            select concat_ws('|', 'ref', c.conrelid::regclass::text, c.conname::text,
                             pg_get_constraintdef(c.oid), c.convalidated::text)
            from pg_constraint c
            join rels on c.confrelid = rels.r
            where c.contype = 'f'
              and not exists (select 1 from rels o where o.r = c.conrelid)

            union all
            select concat_ws('|', 'idx', i.indrelid::regclass::text, i.indexrelid::regclass::text,
                             pg_get_indexdef(i.indexrelid), i.indisvalid::text, i.indisready::text)
            from pg_index i
            join rels on i.indrelid = rels.r

            union all
            select concat_ws('|', 'trg', t.tgrelid::regclass::text, t.tgname::text,
                             pg_get_triggerdef(t.oid), t.tgenabled::text)
            from pg_trigger t
            join rels on t.tgrelid = rels.r
            where not t.tgisinternal

            union all
            select concat_ws('|', 'ri', t.tgrelid::regclass::text, k.conname::text, k.conrelid::regclass::text,
                             f.proname::text, t.tgtype::text, t.tgenabled::text)
            from pg_trigger t
            join rels on t.tgrelid = rels.r
            join pg_constraint k on k.oid = t.tgconstraint
            join pg_proc f on f.oid = t.tgfoid
            where t.tgisinternal

            union all
            select concat_ws('|', 'pol', p.polrelid::regclass::text, p.polname::text, p.polcmd::text, p.polpermissive::text,
                             array_to_string(array(
                               select u.r::regrole::text from unnest(p.polroles) as u(r)
                               order by u.r::regrole::text collate "C"), ','),
                             coalesce(pg_get_expr(p.polqual, p.polrelid), '-'),
                             coalesce(pg_get_expr(p.polwithcheck, p.polrelid), '-'))
            from pg_policy p
            join rels on p.polrelid = rels.r

