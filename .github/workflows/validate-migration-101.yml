              where c.conname = r.fk
                and c.contype = 'f'
                and c.convalidated
                and c.confdeltype = 'c'
                and c.conrelid = ('public.' || r.child)::regclass
                and c.confrelid = ('public.' || r.parent)::regclass
                and pg_temp.cols(c.conrelid, c.conkey) = array['company_id', r.col]
                and pg_temp.cols(c.confrelid, c.confkey) = array['company_id', 'id']);
            if v_bad is not null then raise exception 'FK composta ausente ou divergente: %', v_bad; end if;

