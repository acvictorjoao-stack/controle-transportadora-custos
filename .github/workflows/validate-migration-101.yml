name: validate-migration-101

on:
  push:
    branches:
      - ci/validate-migration-101

permissions:
  contents: read

concurrency:
  group: validate-migration-101
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DO_NOT_TRACK: '1'
  SUPABASE_TELEMETRY_DISABLED: '1'

jobs:
  contract:
    name: Contrato estático da 101 (vitest)
    # Só roda em repositório privado: logs e artefatos de repositório público são públicos.
    if: github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run features/organization/__tests__/trigger-parent-company-isolation-migration-contract.test.ts

  postgres:
    name: PostgreSQL ${{ matrix.pg }} — migrations 001–101
    if: github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: ${{ matrix.pg == '15' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: '17'
            pin: '17.6.1.127'
            server_prefix: '17.6'
          - pg: '15'
            pin: ''
            server_prefix: '15.'
    env:
      SUPABASE_DB_MAJOR_VERSION: ${{ matrix.pg }}
      EXPECTED_PIN: ${{ matrix.pin }}
      EXPECTED_SERVER_PREFIX: ${{ matrix.server_prefix }}
      DB_CONTAINER: supabase_db_fleetcontrol
      MIGRATION_101: 101_trigger_parent_company_isolation.sql
      BEHAVIORAL_TEST: database/tests/trigger-parent-company-isolation.sql
      EXPECTED_CASES: '68'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Isolar o runner do projeto vinculado
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY SUPABASE_PROJECT_ID DATABASE_URL; do
            if [ -n "${!v:-}" ]; then echo "::error::$v não pode estar definido"; exit 1; fi
          done
          if [ -n "$EXPECTED_PIN" ]; then
            tracked_pin=$(tr -d '[:space:]' < supabase/.temp/postgres-version)
            if [ "$tracked_pin" != "$EXPECTED_PIN" ]; then
              echo "::error::pin rastreado ($tracked_pin) difere do esperado ($EXPECTED_PIN)"; exit 1
            fi
          fi
          # Só o pin do Postgres sobrevive: Auth, Storage e REST usam os padrões da CLI 2.121.0.
          rm -rf supabase/.temp
          if [ -n "$EXPECTED_PIN" ]; then
            mkdir -p supabase/.temp
            printf '%s' "$EXPECTED_PIN" > supabase/.temp/postgres-version
          fi
          temp_files=$(if [ -d supabase/.temp ]; then find supabase/.temp -mindepth 1 -printf '%P\n' | LC_ALL=C sort | paste -sd, -; fi)
          if [ "$temp_files" != "${EXPECTED_PIN:+postgres-version}" ]; then
            echo "::error::supabase/.temp inesperado no runner: '$temp_files'"; exit 1
          fi
          echo "supabase/.temp no runner: ${temp_files:-<ausente>}"
          git diff --exit-code -- supabase/config.toml
          {
            echo "LOG_DIR=$RUNNER_TEMP/logs"
            echo "PRIVATE_DIR=$RUNNER_TEMP/private"
            echo "SQL_DIR=$RUNNER_TEMP/sql"
            echo "HELD_DIR=$RUNNER_TEMP/held"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs" "$RUNNER_TEMP/private" "$RUNNER_TEMP/sql" "$RUNNER_TEMP/held" "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Gerar scripts auxiliares
        run: |
          BIN="$RUNNER_TEMP/bin"

          cat > "$BIN/psql-admin" <<'SH'
          #!/usr/bin/env bash
          exec docker exec -i "$DB_CONTAINER" psql -h /var/run/postgresql -U supabase_admin -d postgres -X -v ON_ERROR_STOP=1 "$@"
          SH

          # Filtro best-effort: reduz exposição, não prova ausência de segredos.
          # Por isso o start.log bruto nunca entra no artefato.
          cat > "$BIN/redact" <<'SH'
          #!/usr/bin/env bash
          exec sed -E \
            -e 's#(postgres(ql)?://)[^@/[:space:]]+@#\1[REDACTED]@#g' \
            -e 's#eyJ[A-Za-z0-9_-]{8,}(\.[A-Za-z0-9_-]*){0,2}#[REDACTED_JWT]#g' \
            -e 's#sb_(publishable|secret)_[A-Za-z0-9_-]+#[REDACTED_KEY]#g' \
            -e 's#sbp_[A-Za-z0-9]+#[REDACTED_TOKEN]#g' \
            -e 's#super-secret-jwt-token[A-Za-z0-9_-]*#[REDACTED_SECRET]#g' \
            -e '/sha256:/!s#[0-9A-Fa-f]{32,}#[REDACTED_HEX]#g' \
            -e 's#((secret|key|token|password|passwd|pwd)"?[[:space:]]*[:=][[:space:]]*"?)[^[:space:]",]+#\1[REDACTED]#Ig'
          SH

          cat > "$BIN/check-version" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          image=$(docker inspect -f '{{.Config.Image}}' "$DB_CONTAINER")
          image_id=$(docker inspect -f '{{.Image}}' "$DB_CONTAINER")
          server=$(psql-admin -At -c 'show server_version')
          echo "imagem: $image ($image_id) | server_version: $server" | tee -a "$LOG_DIR/env.txt"
          if [ -n "$EXPECTED_PIN" ] && [[ "$image" != *":$EXPECTED_PIN" ]]; then
            echo "::error::imagem $image não usa o pin $EXPECTED_PIN"; exit 1
          fi
          if [[ "$server" != "$EXPECTED_SERVER_PREFIX"* ]]; then
            echo "::error::servidor $server fora de $EXPECTED_SERVER_PREFIX"; exit 1
          fi
          SH

          cat > "$BIN/check-chain" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          files=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | LC_ALL=C sort)
          bad=$(printf '%s\n' "$files" | grep -vE '^[0-9]+_.*\.sql$' || true)
          if [ -n "$bad" ]; then
            echo "::error::migrations fora do padrão <versão>_<nome>.sql (a CLI as ignoraria): $bad"; exit 1
          fi
          expected=$(printf '%s\n' "$files" | sed -E 's/^([0-9]+)_.*\.sql$/\1/' | LC_ALL=C sort)
          if ! diff <(printf '%s\n' "$expected") <(seq -f '%03g' 1 "$1"); then
            echo "::error::arquivos de migration com lacuna, duplicata ou excesso (esperado 001–$1)"; exit 1
          fi
          applied=$(psql-admin -At -c 'select version from supabase_migrations.schema_migrations order by version collate "C"')
          if ! diff <(printf '%s\n' "$expected") <(printf '%s\n' "$applied"); then
            echo "::error::migrations aplicadas divergem dos arquivos"; exit 1
          fi
          test "$(printf '%s\n' "$applied" | tail -n1)" = "$1"
          echo "cadeia OK: $(printf '%s\n' "$applied" | wc -l) migrations, última $1" | tee -a "$LOG_DIR/env.txt"
          SH

          cat > "$BIN/check-catalog" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          out="$LOG_DIR/catalog-$1.txt"
          if ! psql-admin -f - < "$SQL_DIR/catalog.sql" > "$out" 2>&1; then
            cat "$out"; echo "::error::catálogo da 101 inválido ($1)"; exit 1
          fi
          if ! psql-admin -f - < "$SQL_DIR/key-columns-notnull.sql" >> "$out" 2>&1; then
            cat "$out"; echo "::error::coluna de chave anulável ($1)"; exit 1
          fi
          cat "$out"
          count=$(psql-admin -At -f - < "$SQL_DIR/count-101-constraints.sql")
          if [ "$count" != "9" ]; then
            echo "::error::esperadas 9 constraints da 101 ($1), encontradas $count"; exit 1
          fi
          SH

          cat > "$BIN/snap-schema" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          label=$1; base=${2:-}
          file="$LOG_DIR/schema-$label.txt"
          psql-admin -At -f - < "$SQL_DIR/schema-fingerprint.sql" > "$file"
          for kind in rel col con idx trg fn; do
            if ! grep -q "^$kind|" "$file"; then
              echo "::error::fingerprint de schema sem linhas '$kind' ($label)"; exit 1
            fi
          done
          echo "schema $label: $(wc -l < "$file") linhas, sha256 $(sha256sum "$file" | cut -d' ' -f1)"
          if [ -n "$base" ] && ! diff -u "$LOG_DIR/schema-$base.txt" "$file"; then
            echo "::error::schema monitorado mudou: $label difere de $base"; exit 1
          fi
          SH

          cat > "$BIN/snap-data" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          label=$1; base=${2:-}
          file="$LOG_DIR/fp-$label.txt"
          psql-admin -At -f - < "$SQL_DIR/fingerprint.sql" > "$file"
          if [ -n "$base" ] && ! diff -u "$LOG_DIR/fp-$base.txt" "$file"; then
            echo "::error::dados mudaram: $label difere de $base"; exit 1
          fi
          SH

          cat > "$BIN/precheck-negative" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          name=$1; inserts=$2; expected=$3
          out="$LOG_DIR/precheck-$name.txt"
          set +e
          {
            echo 'begin;'
            echo 'set local session_replication_role = replica;'
            cat "$SQL_DIR/ids.sql" "$inserts"
            echo 'set local session_replication_role = origin;'
            cat "$HELD_DIR/$MIGRATION_101"
            echo 'rollback;'
          } | psql-admin -f - > "$out" 2>&1
          rc=$?
          set -e
          cat "$out"
          if [ "$rc" -ne 3 ]; then
            echo "::error::a 101 deveria abortar com erro de script (psql rc=3) em $name; rc=$rc"; exit 1
          fi
          if ! grep -qF 'migration 101: registros filhos com vínculo inválido ao pai' "$out"; then
            echo "::error::o aborto de $name não veio da pré-checagem da 101"; exit 1
          fi
          for rel in customer_contract_items maintenance_parts maintenance_services tire_recaps tire_inspections tire_movements; do
            grep -qF "$rel ($expected)" "$out" || { echo "::error::$rel não reportado como ($expected)"; exit 1; }
          done
          count=$(psql-admin -At -f - < "$SQL_DIR/count-101-constraints.sql")
          if [ "$count" != "0" ]; then
            echo "::error::constraints da 101 remanescentes após $name: $count"; exit 1
          fi
          snap-schema "after-precheck-$name" before
          snap-data "after-precheck-$name" before
          SH

          # A CLI abre a própria conexão: as linhas inválidas precisam estar commitadas,
          # e a limpeza é verificada contra o fingerprint "before".
          # O trap trata erros e SIGINT/SIGTERM/SIGHUP: devolve a 101 e remove as linhas gravadas.
          # Durante essa limpeza os três sinais são ignorados, e psql/docker exec/snap-* não têm timeout:
          # a limpeza pode demorar ou travar até o SIGKILL do runner. SIGKILL, timeout forçado do job ou
          # perda do runner interrompem o trap no meio da restauração; ele não garante limpeza em
          # cancelamentos forçados. Resta então o passo "Destruir o ambiente" (supabase stop --no-backup),
          # que só roda se o runner sobreviver.
          cat > "$BIN/cli-negative" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          raw="$PRIVATE_DIR/migration-up-negative.log"
          held="$HELD_DIR/$MIGRATION_101"
          active="supabase/migrations/$MIGRATION_101"
          migration_sha=''
          moved=0
          inserted=0
          final_check_failed=0

          verify_migration_held() {
            local status=0 sha
            if [ -e "$active" ] || [ -L "$active" ]; then
              echo "::error::$MIGRATION_101 continua em supabase/migrations"; status=1
            fi
            if [ ! -f "$held" ]; then
              echo "::error::$MIGRATION_101 ausente de $HELD_DIR"; status=1
            else
              sha=$(sha256sum "$held" | cut -d' ' -f1) || sha=''
              if [ "$sha" != "$migration_sha" ]; then
                echo "::error::sha256 de $MIGRATION_101 em $HELD_DIR não confere: ${sha:-<ilegível>} != $migration_sha"; status=1
              fi
            fi
            return "$status"
          }

          restore_migration() {
            local status=0
            if [ -e "$active" ] && ! mv "$active" "$HELD_DIR/"; then
              echo "::error::não foi possível devolver $MIGRATION_101 de supabase/migrations a $HELD_DIR"; status=1
            fi
            verify_migration_held || status=1
            if [ "$status" -ne 0 ]; then return 1; fi
            moved=0
          }

          cleanup_rows() {
            local mode=$1 status=0
            psql-admin -v mode="$mode" -f - < "$SQL_DIR/cli-negative-cleanup.sql" \
              > "$PRIVATE_DIR/cli-negative-cleanup-$mode.log" 2>&1 || status=$?
            redact < "$PRIVATE_DIR/cli-negative-cleanup-$mode.log" | tee "$LOG_DIR/cli-negative-cleanup-$mode.txt" || true
            if [ "$status" -ne 0 ]; then
              echo "::error::limpeza ($mode) das 6 linhas do cli-negative falhou (psql rc=$status)"; return 1
            fi
            inserted=0
          }

          verify_final_state() {
            if ! { snap-schema "$1" before && snap-data "$1" before; }; then
              echo "::error::estado final do cli-negative não comprovado contra o fingerprint before ($1)"; return 1
            fi
          }

          on_exit() {
            local rc=$? cleanup_rc=0
            trap '' INT TERM HUP
            set +e
            if [ "$rc" -eq 0 ] && { [ "$moved" = 1 ] || [ "$inserted" = 1 ]; }; then
              echo "::error::cli-negative terminou com limpeza pendente"; rc=1
            fi
            if [ "$rc" -ne 0 ]; then
              if [ "$moved" = 1 ] || [ "$inserted" = 1 ]; then
                echo "::error::cli-negative falhou (código $rc) com pendências (moved=$moved, inserted=$inserted); iniciando limpeza de emergência"
                if [ "$moved" = 1 ]; then restore_migration || cleanup_rc=1; fi
                if [ "$inserted" = 1 ]; then
                  cleanup_rows emergency || cleanup_rc=1
                  verify_final_state after-cli-emergency || cleanup_rc=1
                fi
                if [ "$cleanup_rc" -ne 0 ]; then
                  echo "::error::a limpeza de emergência do cli-negative também falhou; estado do banco ou da migration não comprovado"
                else
                  echo "limpeza de emergência concluída e comprovada; o job continua em falha (código $rc)"
                fi
              elif [ "$final_check_failed" = 1 ]; then
                echo "::error::cli-negative falhou (código $rc): a verificação final divergiu do fingerprint before após a limpeza; sem pendências, nenhuma limpeza foi iniciada"
              else
                echo "::error::cli-negative falhou (código $rc) sem pendências de limpeza; nenhuma limpeza foi iniciada"
              fi
            fi
            exit "$rc"
          }
          trap on_exit EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          trap 'exit 129' HUP

          if [ ! -f "$held" ]; then
            echo "::error::$MIGRATION_101 ausente de $HELD_DIR"; exit 1
          fi
          migration_sha=$(sha256sum "$held" | cut -d' ' -f1)
          echo "sha256 de $MIGRATION_101 antes do cli-negative: $migration_sha" | tee -a "$LOG_DIR/env.txt"
          # Marcado antes do commit: se a falha vier depois dele, a limpeza de emergência aceita 0 ou 1 linha.
          inserted=1
          {
            cat "$SQL_DIR/ids.sql"
            echo 'begin;'
            echo 'set local session_replication_role = replica;'
            cat "$SQL_DIR/cross.sql"
            echo 'commit;'
          } | psql-admin -f -
          snap-data cli-dirty
          moved=1
          if ! mv "$held" supabase/migrations/; then
            echo "::error::não foi possível mover $MIGRATION_101 de $HELD_DIR para supabase/migrations"; exit 1
          fi
          set +e
          supabase migration up --local > "$raw" 2>&1
          up_rc=$?
          set -e
          echo "supabase migration up --local saiu com código $up_rc (esperado 1)"
          redact < "$raw" | tee "$LOG_DIR/migration-up-negative.txt"
          echo "código de saída do supabase migration up --local: $up_rc" >> "$LOG_DIR/migration-up-negative.txt"
          if ! restore_migration; then
            echo "::error::código original do supabase migration up --local: $up_rc (esperado 1); diagnóstico filtrado preservado em migration-up-negative.txt"
            exit 1
          fi
          if [ "$up_rc" -ne 1 ]; then
            echo "::error::migration up deveria sair com 1 (erro de SQL); rc=$up_rc"; exit 1
          fi
          if ! grep -qF "Applying migration $MIGRATION_101" "$raw"; then
            echo "::error::a CLI não chegou a aplicar a 101"; exit 1
          fi
          if grep -qF 'Local database is up to date' "$raw"; then
            echo "::error::a CLI relatou sucesso"; exit 1
          fi
          # A CLI repete o texto da instrução que falhou, que contém o prefixo da mensagem;
          # só as contagens calculadas provam que o RAISE da pré-checagem disparou.
          for rel in customer_contract_items maintenance_parts maintenance_services tire_recaps tire_inspections tire_movements; do
            grep -qF "$rel (outra empresa: 1, pai inexistente: 0, chave nula: 0)" "$raw" \
              || { echo "::error::aborto pela CLI sem a contagem calculada de $rel"; exit 1; }
          done
          hist=$(psql-admin -At -c "select count(*) from supabase_migrations.schema_migrations where version = '101'")
          if [ "$hist" != "0" ]; then
            echo "::error::a CLI registrou a 101 no histórico apesar da falha"; exit 1
          fi
          check-chain 100
          count=$(psql-admin -At -f - < "$SQL_DIR/count-101-constraints.sql")
          if [ "$count" != "0" ]; then
            echo "::error::constraints da 101 remanescentes após falha pela CLI: $count"; exit 1
          fi
          snap-schema after-cli-negative before
          snap-data after-cli-negative cli-dirty
          cleanup_rows strict || exit 1
          verify_final_state after-cli-cleanup || { final_check_failed=1; exit 1; }
          SH

          cat > "$BIN/behavioral" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          out="$LOG_DIR/behavioral-$1.txt"
          if ! psql-admin -q -A -t -F '|' -f - < "$BEHAVIORAL_TEST" > "$out" 2>&1; then
            cat "$out"; echo "::error::teste comportamental falhou ($1)"; exit 1
          fi
          cat "$out"
          passed=$(grep -cE '^[0-9]+\|t\|' "$out" || true)
          failed=$(grep -cE '^[0-9]+\|f\|' "$out" || true)
          echo "aprovados: $passed | reprovados: $failed | esperados: $EXPECTED_CASES"
          test "$failed" -eq 0
          test "$passed" -eq "$EXPECTED_CASES"
          SH

          chmod +x "$BIN"/*

      - name: Autoteste do filtro de logs
        run: |
          sample="$RUNNER_TEMP/redact-sample.txt"
          cat > "$sample" <<'TXT'
          DB URL: postgresql://postgres:senha-ficticia@127.0.0.1:54322/postgres
          anon key: eyJhbGciOiJub25lIn0.eyJ0ZXN0Ijp0cnVlfQ.ZmljdGljaW8
          │ Secret │ sb_secret_FICTICIO0000000000 │
          │ S3 Secret Key │ fedcba9876543210fedcba9876543210fedcba9876543210 │
          JWT secret: super-secret-jwt-token-ficticio
          {"password":"senha-ficticia-2"}
          PGPASSWORD=senha-ficticia-3
          Applying migration 101_trigger_parent_company_isolation.sql...
          ERROR: duplicate key value violates unique constraint "tires_company_id_id_key"
          DETAIL:  Key (company_id, id)=(e1000000-0000-4000-8000-000000000001, x) already exists.
          Digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          Skipping migration README.md...
          TXT
          filtered=$(redact < "$sample")
          for leak in 'senha-ficticia' 'eyJ' 'sb_secret_' 'fedcba9876543210' 'super-secret-jwt-token'; do
            if grep -qF -- "$leak" <<< "$filtered"; then
              echo "::error::redact deixou passar: $leak"; exit 1
            fi
          done
          for keep in '@127.0.0.1:54322/postgres' 'Applying migration 101_trigger_parent_company_isolation.sql' \
                      'duplicate key value violates unique constraint "tires_company_id_id_key"' \
                      'Key (company_id, id)=(e1000000-0000-4000-8000-000000000001, x) already exists' \
                      'sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' 'Skipping migration'; do
            if ! grep -qF -- "$keep" <<< "$filtered"; then
              echo "::error::redact destruiu diagnóstico: $keep"; exit 1
            fi
          done
          echo "filtro de logs OK"

      - name: Gerar scripts SQL de verificação
        run: |
          cat > "$SQL_DIR/ids.sql" <<'SQL'
          \set e1 'e1000000-0000-4000-8000-000000000001'
          \set e2 'e2000000-0000-4000-8000-000000000001'
          \set cu1 'e1000000-0000-4000-8000-000000000002'
          \set cu2 'e2000000-0000-4000-8000-000000000002'
          \set c1 'e1000000-0000-4000-8000-000000000003'
          \set c2 'e2000000-0000-4000-8000-000000000003'
          \set v1 'e1000000-0000-4000-8000-000000000004'
          \set v2 'e2000000-0000-4000-8000-000000000004'
          \set m1 'e1000000-0000-4000-8000-000000000005'
          \set m2 'e2000000-0000-4000-8000-000000000005'
          \set t1 'e1000000-0000-4000-8000-000000000006'
          \set t2 'e2000000-0000-4000-8000-000000000006'
          \set dead_contract 'dead0000-0000-4000-8000-0000000000c1'
          \set dead_record 'dead0000-0000-4000-8000-0000000000d1'
          \set dead_tire 'dead0000-0000-4000-8000-0000000000e1'
          SQL

          cat > "$SQL_DIR/supabase-objects.sql" <<'SQL'
          do $$
          declare
            v_bad text;
          begin
            select string_agg(o, ', ') into v_bad
            from unnest(array['auth.users', 'storage.buckets', 'storage.objects']) as o
            where to_regclass(o) is null;
            if v_bad is not null then raise exception 'tabelas do Supabase ausentes: %', v_bad; end if;

            select string_agg(f, ', ') into v_bad
            from unnest(array['auth.uid()', 'storage.foldername(text)']) as f
            where to_regprocedure(f) is null;
            if v_bad is not null then raise exception 'funções do Supabase ausentes: %', v_bad; end if;

            select string_agg(r, ', ') into v_bad
            from unnest(array['anon', 'authenticated', 'service_role']) as r
            where not exists (select 1 from pg_roles where rolname = r);
            if v_bad is not null then raise exception 'roles ausentes: %', v_bad; end if;

            if not (select rolbypassrls from pg_roles where rolname = 'service_role') then
              raise exception 'service_role sem BYPASSRLS';
            end if;
            if not exists (select 1 from pg_extension where extname = 'pgcrypto') then
              raise exception 'pgcrypto ausente';
            end if;
            if not exists (select 1 from pg_trigger where tgrelid = 'auth.users'::regclass and tgname = 'on_auth_user_created') then
              raise exception 'trigger on_auth_user_created (005) ausente';
            end if;
            if not (select rolsuper from pg_roles where rolname = current_user) then
              raise exception 'o teste comportamental exige superusuário; conectado como %', current_user;
            end if;
            raise notice 'objetos do Supabase OK (%)', version();
          end
          $$;
          SQL

          cat > "$SQL_DIR/seed.sql" <<'SQL'
          begin;
          insert into public.companies (id, legal_name, tax_id, slug, email) values
            (:'e1', 'CI101 Empresa 1', 'CI101-TAX-1', 'ci101-empresa-1', 'e1@ci101.test'),
            (:'e2', 'CI101 Empresa 2', 'CI101-TAX-2', 'ci101-empresa-2', 'e2@ci101.test');
          insert into public.customers (id, company_id, legal_name) values
            (:'cu1', :'e1', 'Cliente CI101 1'),
            (:'cu2', :'e2', 'Cliente CI101 2');
