              ('tire_inspections', 'tire_inspections_log_history'),
              ('tire_movements', 'tire_movements_log_history')) as t(rel, trg)
            where not exists (
              select 1 from pg_trigger g
              where g.tgrelid = ('public.' || t.rel)::regclass
                and g.tgname = t.trg
                and g.tgenabled = 'O');
            if v_bad is not null then raise exception 'trigger ausente ou desabilitada: %', v_bad; end if;

