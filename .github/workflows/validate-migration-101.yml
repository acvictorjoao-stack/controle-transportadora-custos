            select concat_ws('|', 'fn', fns.fn_oid::regprocedure::text, pg_get_userbyid(p.proowner)::text,
                             coalesce(p.proacl::text, '-'), md5(pg_get_functiondef(fns.fn_oid)))
            from fns
            join pg_proc p on p.oid = fns.fn_oid
          ) s(x)
          order by x collate "C";
