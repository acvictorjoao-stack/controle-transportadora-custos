            end if;
            if v_bad <> '' then
              raise exception 'chave nula não rejeitada pelo NOT NULL da própria coluna: %', v_bad;
            end if;
            raise notice 'chave nula rejeitada (23502) nas 12 colunas, mesmo com session_replication_role = replica';
          end
          $$;
          rollback;
          SQL

          # Filtros = par cruzado (e1, pai da e2) + valores exatos de cross.sql.
          # strict (caminho normal): exatamente 1 linha por tabela.
          # emergency (trap do cli-negative): 0 ou 1, pois a falha pode ter ocorrido antes do commit.
          # Nos dois modos, mais de 1 linha ou par cruzado remanescente aborta e desfaz a transação.
          cat > "$SQL_DIR/cli-negative-cleanup.sql" <<'SQL'
          begin;
          set local session_replication_role = replica;
          set local ci101.cleanup_mode = :'mode';
          do $$
          declare
            v_mode text := current_setting('ci101.cleanup_mode');
            v_company uuid := 'e1000000-0000-4000-8000-000000000001';
            v_case record;
            v_rows bigint;
            v_left bigint;
            v_n int := 0;
            v_bad text := '';
            v_report text := '';
          begin
            if v_mode not in ('strict', 'emergency') then
              raise exception 'modo de limpeza inválido: %', v_mode;
            end if;
            for v_case in
              select * from (values
                ('customer_contract_items', 'contract_id', 'e2000000-0000-4000-8000-000000000003',
                 $q$freight_value = 1$q$),
                ('maintenance_parts', 'maintenance_record_id', 'e2000000-0000-4000-8000-000000000005',
                 $q$name = 'X' and quantity = 1 and unit_price = 1 and total_price = 1$q$),
                ('maintenance_services', 'maintenance_record_id', 'e2000000-0000-4000-8000-000000000005',
                 $q$description = 'X' and amount = 1$q$),
                ('tire_recaps', 'tire_id', 'e2000000-0000-4000-8000-000000000006',
                 $q$amount = 1$q$),
                ('tire_inspections', 'tire_id', 'e2000000-0000-4000-8000-000000000006',
                 $q$tread_depth_mm = 1$q$),
                ('tire_movements', 'tire_id', 'e2000000-0000-4000-8000-000000000006',
                 $q$movement_type = 'remove' and vehicle_id is null and position is null$q$)
              ) as t(rel, col, parent_id, payload)
            loop
              v_n := v_n + 1;
              execute format('delete from public.%I where company_id = $1 and %I = $2 and %s',
                             v_case.rel, v_case.col, v_case.payload)
                using v_company, v_case.parent_id::uuid;
              get diagnostics v_rows = row_count;
              execute format('select count(*) from public.%I where company_id = $1 and %I = $2', v_case.rel, v_case.col)
                into v_left using v_company, v_case.parent_id::uuid;
              v_report := v_report || format('%s: removidas %s, restantes %s; ', v_case.rel, v_rows, v_left);
              if v_rows > 1 or v_left <> 0 or (v_mode = 'strict' and v_rows <> 1) then
                v_bad := v_bad || format('%s (removidas %s, restantes %s); ', v_case.rel, v_rows, v_left);
              end if;
            end loop;
            if v_n <> 6 then
              raise exception 'limpeza do cli-negative: esperadas 6 tabelas, processadas %', v_n;
            end if;
            if v_bad <> '' then
              raise exception 'limpeza (%) do cli-negative fora do esperado: %', v_mode, v_bad;
            end if;
            raise notice 'limpeza (%) do cli-negative: %', v_mode, v_report;
          end
          $$;
          commit;
          SQL

          cat > "$SQL_DIR/legacy-after-101.sql" <<'SQL'
          begin;
          insert into public.customer_contract_items (company_id, contract_id, freight_value) values (:'e1', :'c1', 100);
          insert into public.tire_recaps (company_id, tire_id, amount) values (:'e1', :'t1', 40);
          delete from public.customer_contracts where id = :'c2';

          do $$
          begin
            if (select contracted_revenue from public.customer_contracts where id = 'e1000000-0000-4000-8000-000000000003') is distinct from 1100.00 then
              raise exception 'legado: receita do contrato 1 deveria ir a 1100';
            end if;
            if (select recap_count from public.tires where id = 'e1000000-0000-4000-8000-000000000006') is distinct from 2 then
              raise exception 'legado: pneu 1 deveria ter 2 recapagens';
            end if;
            if exists (select 1 from public.customer_contract_items where contract_id = 'e2000000-0000-4000-8000-000000000003') then
              raise exception 'legado: exclusão do contrato 2 não cascateou os itens';
            end if;
            if (select total_cost from public.maintenance_records where id = 'e2000000-0000-4000-8000-000000000005') is distinct from 1000.00 then
              raise exception 'legado: manutenção da empresa 2 foi alterada';
            end if;
          end
          $$;
          rollback;
          SQL

          cat > "$SQL_DIR/defense-supplement.sql" <<'SQL'
          begin;
          alter table public.customer_contract_items drop constraint customer_contract_items_contract_company_fkey;
          alter table public.maintenance_parts drop constraint maintenance_parts_record_company_fkey;
          alter table public.maintenance_services drop constraint maintenance_services_record_company_fkey;
          alter table public.tire_recaps drop constraint tire_recaps_tire_company_fkey;

          create temp table ci_e2_before as
          select
            (select jsonb_build_object('ctid', c.ctid::text, 'row', to_jsonb(c)) from public.customer_contracts c where c.id = :'c2') as contract,
            (select jsonb_build_object('ctid', m.ctid::text, 'row', to_jsonb(m)) from public.maintenance_records m where m.id = :'m2') as record,
            (select jsonb_build_object('ctid', t.ctid::text, 'row', to_jsonb(t)) from public.tires t where t.id = :'t2') as tire,
            (select count(*) from public.maintenance_history where company_id = :'e2') as maintenance_history,
            (select count(*) from public.tire_history where company_id = :'e2') as tire_history,
            (select count(*) from public.customer_history where company_id = :'e2') as customer_history;

          -- Histórico desligado só aqui: com ele ativo o 23502 aborta antes de o recálculo ser observável.
          alter table public.maintenance_parts disable trigger maintenance_parts_log_history;
          alter table public.maintenance_services disable trigger maintenance_services_log_history;
          insert into public.maintenance_parts (company_id, maintenance_record_id, name, quantity, unit_price, total_price)
          values (:'e1', :'m2', 'X', 1, 99999, 99999);
          insert into public.maintenance_services (company_id, maintenance_record_id, description, amount)
          values (:'e1', :'m2', 'X', 99999);
          -- Cada UPDATE/DELETE precisa afetar exatamente 1 linha; com 0 o caso passaria sem exercitar o trigger.
          do $$
          declare
            v_rows int;
          begin
            update public.maintenance_parts set total_price = 88888
            where company_id = 'e1000000-0000-4000-8000-000000000001' and maintenance_record_id = 'e2000000-0000-4000-8000-000000000005';
            get diagnostics v_rows = row_count;
            if v_rows <> 1 then raise exception 'update de peça cruzada afetou % linhas', v_rows; end if;
            update public.maintenance_services set amount = 88888
            where company_id = 'e1000000-0000-4000-8000-000000000001' and maintenance_record_id = 'e2000000-0000-4000-8000-000000000005';
            get diagnostics v_rows = row_count;
            if v_rows <> 1 then raise exception 'update de serviço cruzado afetou % linhas', v_rows; end if;
            delete from public.maintenance_parts
            where company_id = 'e1000000-0000-4000-8000-000000000001' and maintenance_record_id = 'e2000000-0000-4000-8000-000000000005';
            get diagnostics v_rows = row_count;
            if v_rows <> 1 then raise exception 'delete de peça cruzada afetou % linhas', v_rows; end if;
            delete from public.maintenance_services
            where company_id = 'e1000000-0000-4000-8000-000000000001' and maintenance_record_id = 'e2000000-0000-4000-8000-000000000005';
            get diagnostics v_rows = row_count;
            if v_rows <> 1 then raise exception 'delete de serviço cruzado afetou % linhas', v_rows; end if;
          end
          $$;
          alter table public.maintenance_parts enable trigger maintenance_parts_log_history;
          alter table public.maintenance_services enable trigger maintenance_services_log_history;

          do $$
          declare
            v_rows int;
          begin
            update public.customer_contract_items set contract_id = 'e2000000-0000-4000-8000-000000000003'
            where company_id = 'e1000000-0000-4000-8000-000000000001' and contract_id = 'e1000000-0000-4000-8000-000000000003'
              and freight_value = 700;
            get diagnostics v_rows = row_count;
            if v_rows <> 1 then raise exception 'update de item para contrato cruzado afetou % linhas', v_rows; end if;
            update public.tire_recaps set tire_id = 'e2000000-0000-4000-8000-000000000006'
            where company_id = 'e1000000-0000-4000-8000-000000000001' and tire_id = 'e1000000-0000-4000-8000-000000000006';
            get diagnostics v_rows = row_count;
            if v_rows <> 1 then raise exception 'update de recapagem para pneu cruzado afetou % linhas', v_rows; end if;
            delete from public.customer_contract_items
            where company_id = 'e1000000-0000-4000-8000-000000000001' and contract_id = 'e2000000-0000-4000-8000-000000000003';
            get diagnostics v_rows = row_count;
            if v_rows <> 1 then raise exception 'delete de item cruzado afetou % linhas', v_rows; end if;
            delete from public.tire_recaps
            where company_id = 'e1000000-0000-4000-8000-000000000001' and tire_id = 'e2000000-0000-4000-8000-000000000006';
            get diagnostics v_rows = row_count;
            if v_rows <> 1 then raise exception 'delete de recapagem cruzada afetou % linhas', v_rows; end if;
          end
          $$;

          do $$
          declare
            v_state text;
          begin
            begin
              insert into public.maintenance_services (company_id, maintenance_record_id, description, amount)
              values ('e1000000-0000-4000-8000-000000000001', 'e2000000-0000-4000-8000-000000000005', 'Y', 1);
              v_state := '00000';
            exception when others then
              v_state := sqlstate;
            end;
            if v_state is distinct from '23502' then
              raise exception 'serviço cruzado deveria abortar no histórico (23502), retornou %', v_state;
            end if;
          end
          $$;

          create temp table ci_e2_after as
          select
            (select jsonb_build_object('ctid', c.ctid::text, 'row', to_jsonb(c)) from public.customer_contracts c where c.id = :'c2') as contract,
            (select jsonb_build_object('ctid', m.ctid::text, 'row', to_jsonb(m)) from public.maintenance_records m where m.id = :'m2') as record,
            (select jsonb_build_object('ctid', t.ctid::text, 'row', to_jsonb(t)) from public.tires t where t.id = :'t2') as tire,
            (select count(*) from public.maintenance_history where company_id = :'e2') as maintenance_history,
            (select count(*) from public.tire_history where company_id = :'e2') as tire_history,
            (select count(*) from public.customer_history where company_id = :'e2') as customer_history;

          do $$
          begin
            if (select to_jsonb(b) from ci_e2_before b) is distinct from (select to_jsonb(a) from ci_e2_after a) then
              raise exception 'empresa 2 alterada sem as FKs compostas: antes % | depois %',
                (select to_jsonb(b) from ci_e2_before b), (select to_jsonb(a) from ci_e2_after a);
            end if;
            raise notice 'defesa em profundidade complementar OK';
          end
          $$;
          rollback;
          SQL

      - name: Subir Supabase local só com 001–100
        run: |
          supabase --version | tee "$LOG_DIR/env.txt"
          mv "supabase/migrations/$MIGRATION_101" "$HELD_DIR/"
          if ! supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor > "$PRIVATE_DIR/start.log" 2>&1; then
            redact < "$PRIVATE_DIR/start.log" | tail -n 200
            echo "::error::supabase start falhou (saída bruta só no runner)"; exit 1
          fi
          if grep -qF 'not valid to exclude' "$PRIVATE_DIR/start.log"; then
            grep -F 'not valid to exclude' "$PRIVATE_DIR/start.log" | redact
            echo "::error::nome inválido em --exclude"; exit 1
          fi
          if grep -qF 'Skipping migration' "$PRIVATE_DIR/start.log"; then
            grep -F 'Skipping migration' "$PRIVATE_DIR/start.log" | redact
            echo "::error::a CLI ignorou arquivos de migration"; exit 1
          fi
          docker inspect "$DB_CONTAINER" > /dev/null
          docker ps --format '{{.Names}} {{.Image}}' | LC_ALL=C sort | tee -a "$LOG_DIR/env.txt"
          running_excluded=$(docker ps --format '{{.Image}}' | grep -E '/(studio|imgproxy|realtime|edge-runtime|logflare|vector|supavisor):' || true)
          if [ -n "$running_excluded" ]; then
            echo "::error::serviço excluído por -x está em execução: $running_excluded"; exit 1
          fi
          check-version
          check-chain 100
          psql-admin -f - < "$SQL_DIR/supabase-objects.sql" 2>&1 | tee -a "$LOG_DIR/env.txt"

      - name: Popular dados legados (estado pré-101)
        run: |
          cat "$SQL_DIR/ids.sql" "$SQL_DIR/seed.sql" | psql-admin -f -
          snap-data before
          snap-schema before
          cat "$LOG_DIR/fp-before.txt"

      - name: Pré-checagem real da 101 aborta (6 cruzados, 6 órfãos) sem resíduo
        run: |
          precheck-negative cross "$SQL_DIR/cross.sql" 'outra empresa: 1, pai inexistente: 0, chave nula: 0'
          precheck-negative orphan "$SQL_DIR/orphan.sql" 'outra empresa: 0, pai inexistente: 1, chave nula: 0'

      - name: Chave nula inalcançável no schema 001–100 (desfeito no fim)
        run: |
          psql-admin -f - < "$SQL_DIR/key-columns-notnull.sql" 2>&1 | tee "$LOG_DIR/key-columns-before-101.txt"
          psql-admin -f - < "$SQL_DIR/null-keys.sql" 2>&1 | tee "$LOG_DIR/null-keys.txt"
          snap-schema after-null-keys before
          snap-data after-null-keys before

      - name: Aborto da 101 pela CLI com dados inválidos gravados (limpo no fim)
        run: cli-negative

      - name: Aplicar a 101 pela CLI (mesmo mecanismo do db push)
        run: |
          mv "$HELD_DIR/$MIGRATION_101" supabase/migrations/
          supabase migration up --local 2>&1 | redact | tee "$LOG_DIR/migration-up.txt"
          if grep -F 'Skipping migration' "$LOG_DIR/migration-up.txt"; then exit 1; fi
          check-chain 101
          check-catalog after-101
          snap-data after-101 before
          snap-schema after-101
          if cmp -s "$LOG_DIR/schema-before.txt" "$LOG_DIR/schema-after-101.txt"; then
            echo "::error::a 101 não alterou o schema monitorado"; exit 1
          fi
          diff -u "$LOG_DIR/schema-before.txt" "$LOG_DIR/schema-after-101.txt" > "$LOG_DIR/schema-101.diff" || true
          # A 101 só pode mudar constraints, índices, triggers internas de FK e o corpo das funções.
          for kind in rel col pol trg ref; do
            if ! diff <(grep "^$kind|" "$LOG_DIR/schema-before.txt") <(grep "^$kind|" "$LOG_DIR/schema-after-101.txt"); then
              echo "::error::a 101 alterou linhas '$kind' fora do escopo"; exit 1
            fi
          done
          if ! diff <(grep '^fn|' "$LOG_DIR/schema-before.txt" | cut -d'|' -f1-4) \
                    <(grep '^fn|' "$LOG_DIR/schema-after-101.txt" | cut -d'|' -f1-4); then
            echo "::error::a 101 alterou o conjunto, owner ou ACL das funções monitoradas"; exit 1
          fi

      - name: Triggers e cascatas sobre dados legados (desfeito no fim)
        run: |
          cat "$SQL_DIR/ids.sql" "$SQL_DIR/legacy-after-101.sql" | psql-admin -f -
          check-catalog after-legacy
          snap-schema after-legacy after-101
          snap-data after-legacy before

      - name: Defesa em profundidade complementar (desfeito no fim)
        run: |
          cat "$SQL_DIR/ids.sql" "$SQL_DIR/defense-supplement.sql" | psql-admin -f - 2>&1 | tee "$LOG_DIR/defense-supplement.txt"
          check-catalog after-supplement
          snap-schema after-supplement after-101
          snap-data after-supplement before

      - name: Teste comportamental com dados legados presentes
        run: |
          behavioral with-legacy-data
          check-catalog after-behavioral
          snap-schema after-behavioral after-101
          snap-data after-behavioral before

      - name: Recriar do zero (001–101) e repetir as verificações
        run: |
          supabase db reset --local --no-seed 2>&1 | redact | tee "$LOG_DIR/db-reset.txt"
          if grep -F 'Skipping migration' "$LOG_DIR/db-reset.txt"; then exit 1; fi
          check-version
          check-chain 101
          test "$(psql-admin -At -c "select count(*) from public.companies where slug like 'ci101-%'")" = "0"
          psql-admin -f - < "$SQL_DIR/supabase-objects.sql"
          check-catalog after-reset
          snap-schema after-reset after-101
          snap-data after-reset
          behavioral clean-chain
          check-catalog after-clean-chain
          snap-schema after-clean-chain after-reset
          snap-data after-clean-chain after-reset

      - name: Guardar logs (sem a saída do supabase start)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-101-pg${{ matrix.pg }}
          path: ${{ runner.temp }}/logs
          retention-days: 3

      - name: Destruir o ambiente
        if: always()
        continue-on-error: true
        run: |
          if command -v redact > /dev/null; then
            supabase stop --no-backup 2>&1 | redact
          else
            supabase stop --no-backup > /dev/null 2>&1
          fi
